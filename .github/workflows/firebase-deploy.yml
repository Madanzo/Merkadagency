name: Manual website-only release
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full approved main-branch commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: merkadagency-website-live
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: website-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
      - name: Verify approved revision belongs to main
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint:website
      - run: npm run build
        env:
          GITHUB_SHA: ${{ inputs.approved_sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ inputs.approved_sha }}
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish verified website artifact once
        run: npx -y firebase-tools@latest deploy --only hosting --config firebase.website-review.json --project merkadagency-dd2aa --non-interactive
