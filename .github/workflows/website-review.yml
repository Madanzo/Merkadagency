name: Website review checks
on:
  pull_request:
  push:
    branches: [codex/website-release-review]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint:website
      - run: npm run build:review
