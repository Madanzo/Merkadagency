name: Manual informational website release
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Full final main SHA approved by Camilo after its main-push checks pass'
        required: true
      release_mode:
        description: 'Publish approved candidate, or its prevalidated compatible fallback'
        type: choice
        options: [candidate, compatible-fallback]
        default: candidate
permissions:
  contents: read
concurrency:
  group: merkadagency-website-live
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested SHA
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: '[[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
      - name: Require final main revision
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
          if [ "$RELEASE_MODE" = candidate ]; then test "$(git rev-parse origin/main)" = "$APPROVED_SHA"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx eslint website/private.tsx
      - name: Build exact source with features forcibly disabled
        run: npm run build:seo
        env:
          GITHUB_SHA: ${{ inputs.approved_sha }}
      - run: node --test scripts/seo/acceptance.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: approved-website-${{ inputs.approved_sha }}
          path: |
            dist-site
            dist-rollback
            dist-site.sha256
            dist-rollback.sha256
          retention-days: 90
      - name: Select compatible fallback when explicitly approved
        if: inputs.release_mode == 'compatible-fallback'
        run: |
          rm -rf dist-site
          cp -R dist-rollback dist-site
          npm run verify:seo
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Publish static Hosting files only
        run: npx -y firebase-tools@latest deploy --only hosting --config firebase.seo.json --project merkadagency-dd2aa --non-interactive
